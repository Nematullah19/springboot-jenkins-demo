<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spring Boot Jenkins CI/CD</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #243447;
        }

        .container {
            width: 800px;
            max-width: 90%;
            margin: 60px auto;
        }

        .header {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .badge {
            display: inline-block;
            background: #e8f5e9;
            color: #188038;
            padding: 7px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .section {
            background: white;
            margin-top: 25px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        input {
            padding: 12px;
            width: 55%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            min-height: 25px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .status-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 7px;
        }

        .label {
            font-weight: bold;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Spring Boot CI/CD Application</h1>

        <p>
            GitHub → Jenkins → Maven → systemd → Spring Boot
        </p>

        <span class="badge">
            Version 2.0
        </span>

    </div>


    <div class="section">

        <h2>Original API</h2>

        <button onclick="loadOriginalMessage()">
            Call Original API
        </button>

        <div id="originalMessage" class="result">
            Click the button to call /api/message
        </div>

    </div>


    <div class="section">

        <h2>Personalized Greeting</h2>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            value="Nematullah"
        >

        <button onclick="loadGreeting()">
            Send Greeting
        </button>

        <div id="greetingResult" class="result">
            Enter a name and call the new API.
        </div>

    </div>


    <div class="section">

        <h2>Application Status</h2>

        <button onclick="loadStatus()">
            Refresh Status
        </button>

        <div class="status-grid">

            <div class="status-item">
                <span class="label">Application:</span>
                <div id="application">-</div>
            </div>

            <div class="status-item">
                <span class="label">Status:</span>
                <div id="status">-</div>
            </div>

            <div class="status-item">
                <span class="label">Version:</span>
                <div id="version">-</div>
            </div>

            <div class="status-item">
                <span class="label">Deployment:</span>
                <div id="deployment">-</div>
            </div>

            <div class="status-item" style="grid-column: 1 / 3;">
                <span class="label">Server Time:</span>
                <div id="serverTime">-</div>
            </div>

        </div>

    </div>

</div>


<script>

async function loadOriginalMessage() {

    try {

        const response =
            await fetch('/api/message');

        const data =
            await response.text();

        document.getElementById('originalMessage').innerText = data;

    } catch (error) {

        document.getElementById('originalMessage').innerText =
            'Error contacting API';

    }
}


async function loadGreeting() {

    const name =
        document.getElementById('name').value || 'Visitor';

    try {

        const response =
            await fetch(
                '/api/greeting?name=' +
                encodeURIComponent(name)
            );

        const data =
            await response.json();

        document.getElementById('greetingResult').innerText =
            data.message;

    } catch (error) {

        document.getElementById('greetingResult').innerText =
            'Error contacting greeting API';

    }
}


async function loadStatus() {

    try {

        const response =
            await fetch('/api/status');

        const data =
            await response.json();

        document.getElementById('application').innerText =
            data.application;

        document.getElementById('status').innerText =
            data.status;

        document.getElementById('version').innerText =
            data.version;

        document.getElementById('deployment').innerText =
            data.deployment;

        document.getElementById('serverTime').innerText =
            data.serverTime;

    } catch (error) {

        document.getElementById('status').innerText =
            'ERROR';

    }
}


window.addEventListener(
    'DOMContentLoaded',
    loadStatus
);

</script>

</body>

</html>
